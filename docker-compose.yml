services:
  opend:
    build: .
    container_name: moomoo-opend
    restart: unless-stopped
    stdin_open: true
    tty: true

    ports:
      - "7000:7000"

    expose:
      - "22222"

    volumes:
      - opend-state:/root/.com.moomoo.OpenD/F3CNN

  login-ui:
    build: ./login-ui
    container_name: moomoo-opend-login
    restart: unless-stopped

    ports:
      - "6789:6789"

    volumes:
      - opend-state:/root/.com.moomoo.OpenD/F3CNN:ro

    depends_on:
      - opend


  cerebro:
    build: ./cerebro
    container_name: cerebro
    restart: unless-stopped

    network_mode: "service:opend"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-gpt-5.6-luna}
      AI_RESEARCH_MAX_WORKERS: ${AI_RESEARCH_MAX_WORKERS:-12}

    volumes:
      - cerebro-data:/data

    depends_on:
      - opend


  cerebroui:
    build: ./cerebroui
    container_name: cerebroui
    restart: unless-stopped

    ports:
      - "7100:7100"

    depends_on:
      - cerebro

volumes:
  cerebro-data:
  opend-state:
