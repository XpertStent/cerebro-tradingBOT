name: Validate Cerebro

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile Cerebro Python
        run: python -m compileall -q cerebro/app

      - name: Install backend dependencies
        run: python -m pip install -r cerebro/requirements.txt

      - name: Check backend regressions
        run: python -m unittest discover -s cerebro/tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cerebroui/package.json

      - name: Install CerebroUI dependencies
        working-directory: cerebroui
        run: npm install --no-audit --no-fund

      - name: Check UI regressions
        working-directory: cerebroui
        run: node --test tests/*.test.js

      - name: Build CerebroUI
        working-directory: cerebroui
        run: npm run build
